[project]
name = "funcs"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Mick", email = "25802574+cartemic@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cantera>=3.1.0",
    "h5py>=3.14.0",
    "nptdms>=1.10.0",
    "numpy>=2.3.2",
    "pandas>=2.3.1",
    "pint>=0.24.4",
    "pip>=24.3.1",
    "scikit-image>=0.25.2",
    "scipy>=1.16.1",
    "sdtoolbox",
    "seaborn>=0.13.2",
    "tables>=3.10.2",
    "tqdm>=4.67.1",
    "uncertainties>=3.2.3",
]

[tool.uv.sources]
sdtoolbox = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deepdiff>=8.6.0",
    "ipython>=9.4.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.9",
]
docs = [
    "nbsphinx>=0.9.7",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.2",
]
