[project]
name = "final_manuscript_plotting"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "funcs",
    "matplotlib>=3.10.5",
    "numpy>=2.3.2",
    "pandas>=2.3.1",
    "psycopg>=3.2.9",
    "scripts>=3.0",
    "uncertainties>=3.2.3",
]

[tool.uv.sources]
funcs = { path = "../../../funcs", editable = true }

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"
